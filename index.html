<!DOCTYPE html>
<html lang="en">

            --text-main: #2B2B2B;

            --border-color: #E8E2D9;

        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: var(--text-main); }
        .chat-card { width: 100%; max-width: 680px; height: 85vh; background: var(--card-bg); border-radius: 16px; box-shadow: 0 12px 32px rgba(184, 29, 36, 0.08); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); }
        .chat-header { background: var(--primary-red); color: #FFFFFF; padding: 20px 24px; text-align: center; font-size: 1.15rem; font-weight: 600; border-bottom: 3px solid #D4AF37; }

        .message { max-width: 82%; padding: 14px 18px; border-radius: 12px; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; }
        .agent-msg { background: #FFFFFF; color: var(--text-main); align-self: flex-start; border: 1px solid var(--border-color); }
        .user-msg { background: var(--primary-red); color: #FFFFFF; align-self: flex-end; }
        
        /* 免責事項の固定バー表示 */
        .disclaimer-bar {
            background-color: #F3EFEA;
            color: var(--text-sub);
            font-size: 0.75rem;
            line-height: 1.4;
            padding: 8px 16px;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .chat-footer { padding: 14px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; background: #FFFFFF; }
        input[type="text"] { flex: 1; padding: 14px 20px; border: 1px solid var(--border-color); border-radius: 28px; outline: none; font-size: 0.95rem; background: #FAF9F6; }
        button { background: var(--primary-red); color: white; border: none; padding: 14px 28px; border-radius: 28px; cursor: pointer; font-weight: 600; }
        button:disabled { background: #E0E0E0; color: #999999; }
    </style>
</head>
