<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Trek 2027 AI Concierge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-card { width: 100%; max-width: 650px; height: 85vh; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #1a73e8; color: white; padding: 16px 20px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .agent-msg { background: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-footer { padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; background: #fff; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 24px; outline: none; font-size: 0.95rem; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 24px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="chat-card">
        <div class="chat-header">🌸 Japan Trek 2027 AI コンシェルジュ</div>
        <div class="chat-body" id="chatBody">
            <div class="message agent-msg">こんにちは！Japan Trek 2027 公式AIコンシェルジュです。日程や費用についてご質問をどうぞ！</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="質問を入力してください (例: 京都にはいつ移動しますか？)" onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        const API_KEY = AQ.Ab8RN6KE-s1DrqU0TJw8m7hTrt-IYCdBga9Fo9HVx381ugQ78w; // ここを作成したAPIキーに書き換えます
        const SYSTEM_INSTRUCTION = "あなたは Japan Trek 2027 の公式コンシェルジュAIアシスタントです。旅行日程（3月18〜19日LAX出発、3月20日京都到着）や参加規約などの質問に対して親切丁寧に回答してください。";

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            input.value = '';
            btn.disabled = true;

            const loadingDiv = appendMessage('回答を生成中...', 'agent-msg');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }
                    })
                });

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'エラーが発生しました。時間を置いて再度お試しください。';
                loadingDiv.textContent = reply;
            } catch (err) {
                loadingDiv.textContent = '通信エラーが発生しました。APIキーの設定を確認してください。';
            } finally {
                btn.disabled = false;
            }
        }

        function appendMessage(text, className) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
            return msgDiv;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
