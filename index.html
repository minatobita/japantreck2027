<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Trek 2027 AI Concierge</title>
    <!-- PDF解析用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-card { width: 100%; max-width: 650px; height: 85vh; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #10a37f; color: white; padding: 16px 20px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .agent-msg { background: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: #10a37f; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-footer { padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; background: #fff; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 24px; outline: none; font-size: 0.95rem; }
        button { background: #10a37f; color: white; border: none; padding: 12px 24px; border-radius: 24px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="chat-card">
        <div class="chat-header">🌸 Japan Trek 2027 AI コンシェルジュ</div>
        <div class="chat-body" id="chatBody">
            <div class="message agent-msg">こんにちは！Japan Trek 2027 公式AIコンシェルジュです。日程や費用についてご質問をどうぞ！</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="質問を入力してください..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        const SYSTEM_INSTRUCTION = "あなたは Japan Trek 2027 の公式コンシェルジュAIアシスタントです。提供された参照資料（knowledge/ 内のファイル）を網羅的に確認し、正確かつ親切に回答してください。";
        
        // ナレッジベースとして読み込むファイル群
        const KNOWLEDGE_FILES = [
            'knowledge/JapanTrek_QA_Pre-Info session.pdf'
        ];

        let combinedKnowledgeText = "";

        // ページロード時に knowledge/ 配下のファイルを読み込んで合算
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.pdfjsLib) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            }
            
            for (const filePath of KNOWLEDGE_FILES) {
                try {
                    const res = await fetch(`./${filePath}`);
                    if (!res.ok) continue;

                    if (filePath.toLowerCase().endsWith('.pdf')) {
                        const arrayBuffer = await res.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let pdfText = "";
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            pdfText += content.items.map(item => item.str).join(" ") + "\n";
                        }
                        combinedKnowledgeText += `\n--- 【参照資料: ${filePath}】 ---\n` + pdfText;
                    } else {
                        const text = await res.text();
                        combinedKnowledgeText += `\n--- 【参照資料: ${filePath}】 ---\n` + text;
                    }
                } catch (e) {
                    console.warn(`ファイル読み込みスキップ: ${filePath}`, e);
                }
            }
            console.log("すべての参照資料の読み込みが完了しました。");
        });

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            input.value = '';
            btn.disabled = true;

            const loadingDiv = appendMessage('回答を生成中...', 'agent-msg');

            let fullPrompt = text;
            if (combinedKnowledgeText) {
                fullPrompt = `【参照資料一覧】:\n${combinedKnowledgeText}\n\n【質問】:\n${text}`;
            }

            try {
                // Vercel サーバーレス API (/api/chat) 経由でリクエスト
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: SYSTEM_INSTRUCTION },
                            { role: 'user', content: fullPrompt }
                        ]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    loadingDiv.textContent = `エラー: ${typeof data.error === 'string' ? data.error : data.error.message}`;
                } else {
                    const reply = data.choices?.[0]?.message?.content || '回答を取得できませんでした。';
                    loadingDiv.textContent = reply;
                }
            } catch (err) {
                loadingDiv.textContent = '通信エラーが発生しました。';
                console.error('Fetch Error:', err);
            } finally {
                btn.disabled = false;
            }
        }

        function appendMessage(text, className) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
            return msgDiv;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
