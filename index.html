<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Trek 2027 AI Concierge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-card { width: 100%; max-width: 700px; height: 85vh; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #1a73e8; color: white; padding: 16px 20px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .agent-msg { background: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-footer { padding: 16px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; background: #fff; }
        input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 24px; outline: none; font-size: 0.95rem; }
        input[type="text"]:focus { border-color: #1a73e8; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 24px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>
    <div class="chat-card">
        <div class="chat-header">🌸 Japan Trek 2027 AI コンシェルジュ</div>
        <div class="chat-body" id="chatBody">
            <div class="message agent-msg">こんにちは！Japan Trek 2027 公式AIコンシェルジュです。旅程や事前準備についてご質問をどうぞ！</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="質問を入力してください (例: 京都にはいつ移動しますか？)" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            input.value = '';

            // 簡易レスポンス処理 (Agent Studio API と連携可能)
            setTimeout(() => {
                appendMessage("お問い合わせありがとうございます。資料に基づく回答を生成中です...", 'agent-msg');
            }, 600);
        }

        function appendMessage(text, className) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
